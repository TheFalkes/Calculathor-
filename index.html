<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vault iOS - Medias & Diaporama</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        iosBg: '#000000',
                        iosCard: '#1c1c1e',
                        iosCardHover: '#2c2c2e',
                        iosBlue: '#0a84ff',
                        iosRed: '#ff453a',
                        iosGray: '#8e8e93',
                        iosBorder: '#38383a'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
        }
        .glass {
            background: rgba(28, 28, 30, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-black text-white antialiased min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- ÉCRAN DE VERROUILLAGE (CODE PIN 0507) -->
    <div id="lockScreen" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-xl flex flex-col items-center justify-center p-6 transition-all duration-300">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-iosCard border border-iosBorder rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl text-iosBlue shadow-lg">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-xl font-semibold">Coffre-fort Sécurisé</h1>
            <p class="text-sm text-iosGray mt-1">Saisissez votre code PIN</p>
        </div>

        <div id="pinDots" class="flex space-x-4 mb-10">
            <div class="w-3.5 h-3.5 rounded-full border border-iosGray transition-all"></div>
            <div class="w-3.5 h-3.5 rounded-full border border-iosGray transition-all"></div>
            <div class="w-3.5 h-3.5 rounded-full border border-iosGray transition-all"></div>
            <div class="w-3.5 h-3.5 rounded-full border border-iosGray transition-all"></div>
        </div>

        <!-- Clavier Numérique Style iOS -->
        <div class="grid grid-cols-3 gap-6 w-full max-w-xs">
            <button onclick="enterPin('1')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">1</button>
            <button onclick="enterPin('2')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">2</button>
            <button onclick="enterPin('3')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">3</button>
            <button onclick="enterPin('4')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">4</button>
            <button onclick="enterPin('5')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">5</button>
            <button onclick="enterPin('6')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">6</button>
            <button onclick="enterPin('7')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">7</button>
            <button onclick="enterPin('8')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">8</button>
            <button onclick="enterPin('9')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">9</button>
            <div class="w-16 h-16"></div>
            <button onclick="enterPin('0')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">0</button>
            <button onclick="clearPin()" class="w-16 h-16 rounded-full text-xs text-iosGray flex items-center justify-center mx-auto active:text-white transition"><i class="fa-solid fa-delete-left text-xl"></i></button>
        </div>
    </div>

    <!-- EN-TÊTE PRINCIPALE -->
    <header class="sticky top-0 z-20 glass border-b border-iosBorder/40 px-5 py-4 flex items-center justify-between">
        <h1 id="headerTitle" class="text-2xl font-bold tracking-tight">Dossiers</h1>
        <button id="addFolderBtn" onclick="openCreateFolderModal()" class="w-9 h-9 rounded-full bg-iosBlue/20 text-iosBlue flex items-center justify-center active:scale-95 transition">
            <i class="fa-solid fa-folder-plus text-base"></i>
        </button>
    </header>

    <!-- CONTENU PRINCIPAL (ONGLETS) -->
    <main class="flex-1 px-4 pt-4 pb-24 overflow-y-auto hide-scrollbar">

        <!-- TAB 1: DOSSIERS ET MÉDIAS -->
        <section id="tabFolders" class="tab-content space-y-4">
            <!-- Grille des dossiers -->
            <div id="foldersGrid" class="grid grid-cols-2 gap-3"></div>

            <!-- Vue Intérieur d'un Dossier (Caché par défaut) -->
            <div id="folderDetailView" class="hidden space-y-4">
                <div class="flex items-center justify-between bg-iosCard/60 p-3 rounded-2xl border border-iosBorder">
                    <button onclick="closeFolderDetail()" class="text-iosBlue flex items-center space-x-1 font-medium text-sm">
                        <i class="fa-solid fa-chevron-left"></i>
                        <span>Retour</span>
                    </button>
                    <h2 id="currentFolderName" class="font-semibold text-base truncate max-w-[160px]">Nom dossier</h2>
                    <button onclick="deleteCurrentFolder()" class="text-iosRed text-sm px-2 py-1 rounded-lg hover:bg-iosRed/10">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div>

                <!-- Bouton d'ajout de photos/vidéos -->
                <label class="w-full py-3.5 bg-iosBlue/15 border border-iosBlue/30 text-iosBlue font-medium rounded-2xl flex items-center justify-center space-x-2 active:scale-[0.98] transition cursor-pointer">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span>Ajouter photos & vidéos</span>
                    <input type="file" id="mediaInput" multiple accept="image/*,video/*" class="hidden" onchange="handleMediaUpload(event)">
                </label>

                <!-- Grille des médias du dossier -->
                <div id="mediaGrid" class="grid grid-cols-3 gap-2"></div>
            </div>
        </section>

        <!-- TAB 2: DIAPORAMA ALÉATOIRE -->
        <section id="tabSlideshow" class="tab-content hidden space-y-6">
            <div class="bg-iosCard p-4 rounded-2xl border border-iosBorder space-y-4">
                <div class="flex items-center justify-between">
                    <span class="text-sm font-semibold">Sélectionner les dossiers</span>
                    <button onclick="toggleSelectAllFolders()" id="selectAllBtn" class="text-xs text-iosBlue font-medium">Tout sélectionner</button>
                </div>

                <div id="slideshowFolderList" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>

                <div class="pt-2 border-t border-iosBorder space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-iosGray">Durée d'affichage (Sec)</span>
                        <select id="slideshowTimerSelect" class="bg-black border border-iosBorder rounded-xl px-3 py-1.5 text-sm text-iosBlue font-medium outline-none">
                            <option value="2">2 s</option>
                            <option value="3" selected>3 s</option>
                            <option value="5">5 s</option>
                            <option value="10">10 s</option>
                            <option value="15">15 s</option>
                            <option value="30">30 s</option>
                        </select>
                    </div>

                    <div class="flex items-center justify-between">
                        <span class="text-sm text-iosGray">Lecture vidéos</span>
                        <select id="videoModeSelect" class="bg-black border border-iosBorder rounded-xl px-3 py-1.5 text-sm text-iosBlue font-medium outline-none">
                            <option value="full">Entière</option>
                            <option value="timer">Chrono fixe</option>
                        </select>
                    </div>
                </div>

                <button onclick="startSlideshow()" class="w-full py-4 bg-iosBlue font-semibold text-white rounded-2xl shadow-lg active:scale-95 transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-play text-sm"></i>
                    <span>Lancer le Diaporama Aléatoire</span>
                </button>
            </div>
        </section>

        <!-- TAB 3: RÉGLAGES -->
        <section id="tabSettings" class="tab-content hidden space-y-4">
            <div class="bg-iosCard rounded-2xl border border-iosBorder divide-y divide-iosBorder overflow-hidden">
                <div class="p-4 flex items-center justify-between">
                    <div>
                        <div class="font-medium text-sm">Code de Sécurité PIN</div>
                        <div class="text-xs text-iosGray mt-0.5">Code par défaut : 0507</div>
                    </div>
                    <button onclick="changePinModal()" class="text-xs text-iosBlue font-medium bg-iosBlue/10 px-3 py-1.5 rounded-lg">Modifier</button>
                </div>

                <div class="p-4 flex items-center justify-between">
                    <div>
                        <div class="font-medium text-sm">Stockage IndexedDB</div>
                        <div id="storageUsage" class="text-xs text-iosGray mt-0.5">Calcul en cours...</div>
                    </div>
                    <button onclick="clearAllData()" class="text-xs text-iosRed font-medium bg-iosRed/10 px-3 py-1.5 rounded-lg">Vider tout</button>
                </div>
            </div>
        </section>
    </main>

    <!-- BARRE DE NAVIGATION INFÉRIEURE iOS -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-iosBorder/40 px-6 py-2 flex justify-around items-center z-20">
        <button onclick="switchTab('folders')" id="nav-folders" class="nav-item flex flex-col items-center space-y-1 text-iosBlue">
            <i class="fa-solid fa-folder text-lg"></i>
            <span class="text-[10px] font-medium">Dossiers</span>
        </button>
        <button onclick="switchTab('slideshow')" id="nav-slideshow" class="nav-item flex flex-col items-center space-y-1 text-iosGray">
            <i class="fa-solid fa-shuffle text-lg"></i>
            <span class="text-[10px] font-medium">Aléatoire</span>
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="nav-item flex flex-col items-center space-y-1 text-iosGray">
            <i class="fa-solid fa-gear text-lg"></i>
            <span class="text-[10px] font-medium">Réglages</span>
        </button>
    </nav>

    <!-- MODAL DU DIAPORAMA ULTRA-ÉPURÉ (SEULEMENT UNE CROIX DISCRÈTE) -->
    <div id="slideshowOverlay" class="fixed inset-0 z-50 bg-black hidden flex items-center justify-center">
        <!-- Croix discrète en haut à gauche pour quitter -->
        <button onclick="stopSlideshow()" class="absolute top-6 left-6 z-50 w-10 h-10 rounded-full bg-black/40 text-white/70 hover:text-white backdrop-blur-md flex items-center justify-center transition active:scale-90">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>

        <!-- Conteneur média du diaporama -->
        <div id="slideshowMediaContainer" class="w-full h-full flex items-center justify-center p-0"></div>
    </div>

    <!-- SCRIPT APPLICATION -->
    <script>
        // CONFIGURATION & VARIABLES GLOBALES
        let currentPin = "0507";
        let enteredPin = "";
        let db = null;
        let currentFolderId = null;
        let slideshowInterval = null;
        let activeSlideshowQueue = [];
        let activeSlideshowIndex = 0;

        // INITIALISATION INDEXEDDB
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("VaultMediaApp", 1);
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains("folders")) {
                        database.createObjectStore("folders", { keyPath: "id" });
                    }
                    if (!database.objectStoreNames.contains("media")) {
                        const mediaStore = database.createObjectStore("media", { keyPath: "id" });
                        mediaStore.createIndex("folderId", "folderId", { unique: false });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onerror = (e) => reject(e);
            });
        }

        // ACCÈS SÉCURISÉ PIN
        function enterPin(digit) {
            if (enteredPin.length < 4) {
                enteredPin += digit;
                updatePinDots();
                if (enteredPin.length === 4) {
                    setTimeout(() => {
                        if (enteredPin === currentPin) {
                            document.getElementById("lockScreen").classList.add("hidden");
                            enteredPin = "";
                            updatePinDots();
                            loadFolders();
                            updateStorageUsage();
                        } else {
                            alert("Code PIN incorrect");
                            enteredPin = "";
                            updatePinDots();
                        }
                    }, 150);
                }
            }
        }

        function clearPin() {
            enteredPin = enteredPin.slice(0, -1);
            updatePinDots();
        }

        function updatePinDots() {
            const dots = document.querySelectorAll("#pinDots div");
            dots.forEach((dot, idx) => {
                if (idx < enteredPin.length) {
                    dot.classList.add("bg-white", "border-white");
                } else {
                    dot.classList.remove("bg-white", "border-white");
                }
            });
        }

        // CHANGEMENT DE NAVIGATION (ONGLETS)
        function switchTab(tab) {
            document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
            document.querySelectorAll(".nav-item").forEach(el => {
                el.classList.remove("text-iosBlue");
                el.classList.add("text-iosGray");
            });

            if (tab === 'folders') {
                document.getElementById("tabFolders").classList.remove("hidden");
                document.getElementById("nav-folders").classList.add("text-iosBlue");
                document.getElementById("headerTitle").innerText = "Dossiers";
                document.getElementById("addFolderBtn").classList.remove("hidden");
            } else if (tab === 'slideshow') {
                document.getElementById("tabSlideshow").classList.remove("hidden");
                document.getElementById("nav-slideshow").classList.add("text-iosBlue");
                document.getElementById("headerTitle").innerText = "Diaporama";
                document.getElementById("addFolderBtn").classList.add("hidden");
                renderSlideshowFolderList();
            } else if (tab === 'settings') {
                document.getElementById("tabSettings").classList.remove("hidden");
                document.getElementById("nav-settings").classList.add("text-iosBlue");
                document.getElementById("headerTitle").innerText = "Réglages";
                document.getElementById("addFolderBtn").classList.add("hidden");
                updateStorageUsage();
            }
        }

        // GESTION DES DOSSIERS
        function openCreateFolderModal() {
            const folderName = prompt("Nom du nouveau dossier :");
            if (folderName && folderName.trim() !== "") {
                const folder = {
                    id: 'folder_' + Date.now(),
                    name: folderName.trim(),
                    createdAt: new Date()
                };
                const tx = db.transaction("folders", "readwrite");
                tx.objectStore("folders").add(folder);
                tx.oncomplete = () => loadFolders();
            }
        }

        function loadFolders() {
            const grid = document.getElementById("foldersGrid");
            grid.innerHTML = "";
            const tx = db.transaction("folders", "readonly");
            const store = tx.objectStore("folders");
            const request = store.getAll();

            request.onsuccess = () => {
                const folders = request.result;
                if (folders.length === 0) {
                    grid.innerHTML = `<div class="col-span-2 text-center py-12 text-iosGray text-sm">Aucun dossier. Appuyez sur + pour en créer un.</div>`;
                    return;
                }
                folders.forEach(folder => {
                    const card = document.createElement("div");
                    card.className = "bg-iosCard border border-iosBorder p-4 rounded-2xl flex flex-col justify-between h-32 active:scale-95 transition cursor-pointer";
                    card.onclick = () => openFolder(folder.id, folder.name);
                    card.innerHTML = `
                        <div class="flex items-center justify-between">
                            <i class="fa-solid fa-folder text-3xl text-iosBlue"></i>
                        </div>
                        <div>
                            <div class="font-semibold text-sm truncate">${folder.name}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            };
        }

        function openFolder(folderId, folderName) {
            currentFolderId = folderId;
            document.getElementById("currentFolderName").innerText = folderName;
            document.getElementById("foldersGrid").classList.add("hidden");
            document.getElementById("folderDetailView").classList.remove("hidden");
            document.getElementById("addFolderBtn").classList.add("hidden");
            loadFolderMedia(folderId);
        }

        function closeFolderDetail() {
            currentFolderId = null;
            document.getElementById("folderDetailView").classList.add("hidden");
            document.getElementById("foldersGrid").classList.remove("hidden");
            document.getElementById("addFolderBtn").classList.remove("hidden");
            loadFolders();
        }

        function deleteCurrentFolder() {
            if (confirm("Supprimer ce dossier et tout son contenu ?")) {
                const tx = db.transaction(["folders", "media"], "readwrite");
                tx.objectStore("folders").delete(currentFolderId);
                
                const mediaStore = tx.objectStore("media");
                const index = mediaStore.index("folderId");
                const req = index.getAllKeys(currentFolderId);
                req.onsuccess = () => {
                    req.result.forEach(key => mediaStore.delete(key));
                };
                tx.oncomplete = () => closeFolderDetail();
            }
        }

        // GESTION DES MÉDIAS (SANS POPUP DE SUPPRESSION POST-IMPORT)
        function handleMediaUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0 || !currentFolderId) return;

            const tx = db.transaction("media", "readwrite");
            const store = tx.objectStore("media");

            Array.from(files).forEach(file => {
                const mediaObj = {
                    id: 'media_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                    folderId: currentFolderId,
                    name: file.name,
                    type: file.type.startsWith('video') ? 'video' : 'image',
                    fileData: file,
                    createdAt: new Date()
                };
                store.add(mediaObj);
            });

            tx.oncomplete = () => {
                event.target.value = "";
                loadFolderMedia(currentFolderId);
            };
        }

        function loadFolderMedia(folderId) {
            const grid = document.getElementById("mediaGrid");
            grid.innerHTML = "";
            const tx = db.transaction("media", "readonly");
            const store = tx.objectStore("media");
            const index = store.index("folderId");
            const request = index.getAll(folderId);

            request.onsuccess = () => {
                const items = request.result;
                if (items.length === 0) {
                    grid.innerHTML = `<div class="col-span-3 text-center py-8 text-iosGray text-xs">Dossier vide.</div>`;
                    return;
                }
                items.forEach(item => {
                    const url = URL.createObjectURL(item.fileData);
                    const el = document.createElement("div");
                    el.className = "relative aspect-square bg-black rounded-xl overflow-hidden border border-iosBorder group";
                    
                    if (item.type === 'image') {
                        el.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
                    } else {
                        el.innerHTML = `
                            <video src="${url}" class="w-full h-full object-cover"></video>
                            <div class="absolute inset-0 bg-black/30 flex items-center justify-center">
                                <i class="fa-solid fa-play text-white/80 text-xs"></i>
                            </div>
                        `;
                    }
                    grid.appendChild(el);
                });
            };
        }

        // SELECTION POUR DIAPORAMA
        function renderSlideshowFolderList() {
            const container = document.getElementById("slideshowFolderList");
            container.innerHTML = "";
            const tx = db.transaction("folders", "readonly");
            tx.objectStore("folders").getAll().onsuccess = (e) => {
                const folders = e.target.result;
                if (folders.length === 0) {
                    container.innerHTML = `<div class="text-xs text-iosGray text-center py-2">Aucun dossier disponible.</div>`;
                    return;
                }
                folders.forEach(f => {
                    const div = document.createElement("label");
                    div.className = "flex items-center justify-between p-2.5 bg-black rounded-xl border border-iosBorder text-sm cursor-pointer";
                    div.innerHTML = `
                        <span class="truncate">${f.name}</span>
                        <input type="checkbox" value="${f.id}" class="folder-checkbox w-4 h-4 accent-iosBlue rounded">
                    `;
                    container.appendChild(div);
                });
            };
        }

        function toggleSelectAllFolders() {
            const checkboxes = document.querySelectorAll(".folder-checkbox");
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
            document.getElementById("selectAllBtn").innerText = allChecked ? "Tout sélectionner" : "Tout désélectionner";
        }

        // ALGORITHME VRAI ALÉATOIRE (FISHER-YATES SHUFFLE)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // DIAPORAMA EN MODE ULTRA-ÉPURÉ
        function startSlideshow() {
            const selectedFolderIds = Array.from(document.querySelectorAll(".folder-checkbox:checked")).map(cb => cb.value);
            if (selectedFolderIds.length === 0) {
                alert("Veuillez sélectionner au moins un dossier.");
                return;
            }

            const tx = db.transaction("media", "readonly");
            const store = tx.objectStore("media");
            store.getAll().onsuccess = (e) => {
                const allMedia = e.target.result;
                activeSlideshowQueue = allMedia.filter(m => selectedFolderIds.includes(m.folderId));

                if (activeSlideshowQueue.length === 0) {
                    alert("Les dossiers sélectionnés ne contiennent aucun média.");
                    return;
                }

                // Application du vrai aléatoire
                activeSlideshowQueue = shuffleArray(activeSlideshowQueue);
                activeSlideshowIndex = 0;

                // Affichage Overlay Plein Écran
                document.getElementById("slideshowOverlay").classList.remove("hidden");
                renderSlideshowStep();
            };
        }

        function renderSlideshowStep() {
            clearTimeout(slideshowInterval);
            if (activeSlideshowQueue.length === 0) return;

            const container = document.getElementById("slideshowMediaContainer");
            container.innerHTML = "";

            const currentMedia = activeSlideshowQueue[activeSlideshowIndex];
            const url = URL.createObjectURL(currentMedia.fileData);
            const timerSec = parseInt(document.getElementById("slideshowTimerSelect").value) || 3;
            const videoMode = document.getElementById("videoModeSelect").value;

            if (currentMedia.type === 'image') {
                const img = document.createElement("img");
                img.src = url;
                img.className = "max-w-full max-h-full object-contain";
                container.appendChild(img);

                slideshowInterval = setTimeout(nextSlide, timerSec * 1000);
            } else {
                const video = document.createElement("video");
                video.src = url;
                video.autoplay = true;
                video.playsInline = true;
                video.controls = false;
                video.className = "max-w-full max-h-full object-contain";
                container.appendChild(video);

                if (videoMode === 'full') {
                    video.onended = nextSlide;
                } else {
                    slideshowInterval = setTimeout(nextSlide, timerSec * 1000);
                }
            }
        }

        function nextSlide() {
            activeSlideshowIndex = (activeSlideshowIndex + 1) % activeSlideshowQueue.length;
            renderSlideshowStep();
        }

        function stopSlideshow() {
            clearTimeout(slideshowInterval);
            document.getElementById("slideshowOverlay").classList.add("hidden");
            document.getElementById("slideshowMediaContainer").innerHTML = "";
        }

        // RÉGLAGES & STOCKAGE
        function updateStorageUsage() {
            if (navigator.storage && navigator.storage.estimate) {
                navigator.storage.estimate().then(estimate => {
                    const mb = (estimate.usage / (1024 * 1024)).toFixed(1);
                    document.getElementById("storageUsage").innerText = `Espace utilisé : ${mb} Mo`;
                });
            }
        }

        function changePinModal() {
            const newPin = prompt("Saisissez le nouveau code PIN (4 chiffres) :");
            if (newPin && newPin.length === 4 && !isNaN(newPin)) {
                currentPin = newPin;
                alert("Code PIN mis à jour avec succès.");
            } else if (newPin !== null) {
                alert("Code invalide. Le PIN doit comporter 4 chiffres.");
            }
        }

        function clearAllData() {
            if (confirm("ATTENTION : Cela supprimera définitivement tous vos dossiers et tous vos médias enregistrés.")) {
                const tx = db.transaction(["folders", "media"], "readwrite");
                tx.objectStore("folders").clear();
                tx.objectStore("media").clear();
                tx.oncomplete = () => {
                    alert("Coffre-fort réinitialisé.");
                    switchTab("folders");
                    loadFolders();
                    updateStorageUsage();
                };
            }
        }

        // DÉMARRAGE DE L'APPLICATION
        window.onload = () => {
            initDB();
        };
    </script>
</body>
</html>
