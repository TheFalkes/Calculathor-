<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Vault iOS - Medias & Navigateur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        iosBg: '#0b0b12',
                        iosCard: '#151522',
                        iosCardBorder: '#232338',
                        iosPurple: '#635bff',
                        iosBlue: '#0a84ff',
                        iosRed: '#ff453a',
                        iosGray: '#8e8e93'
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            position: fixed;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0b12;
            color: #ffffff;
        }

        /* SAFE AREA IPHONE 15 PLUS (DYNAMIC ISLAND) */
        header {
            padding-top: calc(env(safe-area-inset-top, 47px) + 12px) !important;
        }

        nav {
            padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 8px) !important;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-iosBg text-white antialiased w-full h-full flex flex-col justify-between overflow-hidden inset-0">

    <!-- ÉCRAN DE VERROUILLAGE PIN (0507) -->
    <div id="lockScreen" class="fixed inset-0 z-50 bg-iosBg flex flex-col items-center justify-center p-6 touch-none">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-iosCard border border-iosCardBorder rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl text-iosPurple shadow-xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-xl font-bold">Coffre-fort Sécurisé</h1>
            <p class="text-sm text-iosGray mt-1">Saisissez votre code PIN</p>
        </div>

        <div id="pinDots" class="flex space-x-4 mb-10">
            <div class="w-3.5 h-3.5 rounded-full border border-iosGray transition-all"></div>
            <div class="w-3.5 h-3.5 rounded-full border border-iosGray transition-all"></div>
            <div class="w-3.5 h-3.5 rounded-full border border-iosGray transition-all"></div>
            <div class="w-3.5 h-3.5 rounded-full border border-iosGray transition-all"></div>
        </div>

        <div class="grid grid-cols-3 gap-6 w-full max-w-xs">
            <button onclick="enterPin('1')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">1</button>
            <button onclick="enterPin('2')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">2</button>
            <button onclick="enterPin('3')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">3</button>
            <button onclick="enterPin('4')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">4</button>
            <button onclick="enterPin('5')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">5</button>
            <button onclick="enterPin('6')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">6</button>
            <button onclick="enterPin('7')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">7</button>
            <button onclick="enterPin('8')" class="w-16 h-16 rounded-full bg-iosCard text-2xl font-light mx-auto active:bg-iosGray/40 transition">8</button>

    <!-- CONTENU PRINCIPAL -->

            <!-- Vue Intérieur d'un Dossier -->

                            Sélect.
                        </button>
                        <button onclick="deleteCurrentFolder()" class="text-iosRed text-sm px-2 py-1 rounded-lg">
                            <i class="fa-regular fa-trash-can"></i>

                    </div>

                <!-- Barre d'actions en mode sélection -->
                <div id="selectionActionBar" class="hidden bg-iosCard p-3 rounded-2xl border border-iosCardBorder flex items-center justify-between">
                    <button onclick="toggleSelectAllMedia()" id="selectAllMediaBtn" class="text-xs text-iosPurple font-medium">Tout sélectionner</button>
                    <div class="flex items-center space-x-2">
                        <button onclick="openMoveModal()" class="text-xs bg-iosPurple/20 text-iosPurple px-3 py-1.5 rounded-xl font-medium">Déplacer</button>
                        <button onclick="deleteSelectedMedia()" class="text-xs bg-iosRed/20 text-iosRed px-3 py-1.5 rounded-xl font-medium">Supprimer</button>

                <div class="pt-2 border-t border-iosCardBorder space-y-3">

        <!-- TAB 4: RÉGLAGES STYLE INCALC -->

                <div class="p-4 flex items-center justify-between">

                    </div>
                    <button onclick="changePinModal()" class="text-xs text-iosPurple font-medium bg-iosPurple/10 px-3 py-1.5 rounded-lg">Modifier</button>
                </div>

                <div class="p-4 space-y-3">
                    <div class="font-medium text-sm">Sauvegarde & Export ZIP</div>

        <!-- BOUTON FLOTTANT TYPE MENU CIRCULAIRE (+) STYLE INCALC -->

            <div id="fabMenu" class="hidden flex flex-col items-end space-y-2 transition-all">

                    <i class="fa-solid fa-folder-plus text-sm"></i>
                    <input type="file" id="fabFileInput" multiple accept="image/*,video/*" class="hidden" onchange="handleFabUpload(event)">
                </label>
            </div>
            <button onclick="toggleFabMenu()" id="fabMainBtn" class="w-13 h-13 rounded-full bg-iosPurple text-white shadow-2xl flex items-center justify-center active:scale-90 transition text-xl">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

    <!-- BARRE DE NAVIGATION INFÉRIEURE AVEC ACCÈS RAPIDE -->
    <nav class="shrink-0 bg-iosBg/90 backdrop-blur-md border-t border-iosCardBorder/60 px-5 pt-2.5 flex justify-around items-center z-20">
        <button onclick="switchTab('folders')" id="nav-folders" class="nav-item flex flex-col items-center space-y-1 text-iosPurple">
            <i class="fa-solid fa-folder text-lg"></i>
            <span class="text-[10px] font-medium">Dossiers</span>
        </button>
        <button onclick="switchTab('browser')" id="nav-browser" class="nav-item flex flex-col items-center space-y-1 text-iosGray">
            <i class="fa-solid fa-compass text-lg"></i>
            <span class="text-[10px] font-medium">Web</span>

        <button onclick="switchTab('slideshow')" id="nav-slideshow" class="nav-item flex flex-col items-center space-y-1 text-iosGray">

            <span class="text-[10px] font-medium">Aléatoire</span>
        </button>

    <!-- VISIONNEUSE GRAND ÉCRAN STYLE INCALC AVEC BARRE D'ACTIONS -->
    <div id="mediaViewerModal" class="fixed inset-0 z-50 bg-black hidden flex flex-col items-center justify-between p-4 backdrop-blur-md touch-none">
        <div class="w-full flex items-center justify-between z-10 pt-safe px-2">
            <button onclick="closeMediaViewer()" class="w-10 h-10 rounded-full bg-iosCard border border-iosCardBorder text-white flex items-center justify-center active:scale-90 transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <span id="viewerCounter" class="text-xs text-iosGray font-semibold">1 / 1</span>
        </div>

        <div id="viewerContent" class="w-full flex-1 flex items-center justify-center p-2 my-auto overflow-hidden"></div>

        <!-- BARRE D'ACTIONS INFERIEURE VISIONNEUSE -->
        <div class="w-full bg-iosCard/80 backdrop-blur-md border border-iosCardBorder rounded-2xl py-3 px-6 flex justify-around items-center z-10 pb-safe">
            <button onclick="navigateViewer(-1)" class="flex flex-col items-center text-iosGray active:text-white">
                <i class="fa-solid fa-chevron-left text-sm"></i>
                <span class="text-[9px] mt-1">Préc.</span>
            </button>
            <button onclick="openMoveModal()" class="flex flex-col items-center text-iosGray active:text-white">
                <i class="fa-solid fa-right-to-bracket text-sm"></i>
                <span class="text-[9px] mt-1">Déplacer</span>
            </button>
            <button onclick="deleteViewerMedia()" class="flex flex-col items-center text-iosRed active:scale-95">
                <i class="fa-regular fa-trash-can text-sm"></i>
                <span class="text-[9px] mt-1">Supprimer</span>
            </button>
            <button onclick="navigateViewer(1)" class="flex flex-col items-center text-iosGray active:text-white">
                <i class="fa-solid fa-chevron-right text-sm"></i>
                <span class="text-[9px] mt-1">Suiv.</span>
            </button>
        </div>
    </div>

    <!-- MODAL DÉPLACEMENT DE DOSSIER -->
    <div id="moveMediaModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 touch-none">
        <div class="bg-iosCard border border-iosCardBorder w-full max-w-sm rounded-2xl p-5 space-y-4">
            <h3 class="font-semibold text-base">Déplacer vers un dossier</h3>
            <div id="targetFolderList" class="space-y-2 max-h-48 overflow-y-auto hide-scrollbar"></div>
            <div class="flex justify-end space-x-2 pt-2 border-t border-iosCardBorder">
                <button onclick="closeMoveModal()" class="px-4 py-2 text-xs text-iosGray">Annuler</button>
            </div>
        </div>
    </div>

    <!-- OVERLAY DIAPORAMA -->
    <div id="slideshowOverlay" class="fixed inset-0 z-50 bg-black hidden flex items-center justify-center touch-none">
        <button onclick="stopSlideshow()" class="absolute top-8 left-6 z-50 w-10 h-10 rounded-full bg-black/40 text-white backdrop-blur-md flex items-center justify-center active:scale-90 transition">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>
        <div id="slideshowMediaContainer" class="w-full h-full flex items-center justify-center p-0"></div>
    </div>

    <script>
        // SÉCURITÉ GESTES IPHONE 15 PLUS
        document.addEventListener('gesturestart', e => e.preventDefault());
        document.addEventListener('touchmove', e => { if (e.scale && e.scale !== 1) e.preventDefault(); }, { passive: false });

        let currentPin = "0507";
        let enteredPin = "";
        let db = null;
        let currentFolderId = null;
        let slideshowInterval = null;
        let activeSlideshowQueue = [];
        let activeSlideshowIndex = 0;
        let currentFolderMediaList = [];
        let currentViewerIndex = 0;
        let isSelectMode = false;
        let selectedMediaIds = new Set();

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("VaultMediaApp", 1);
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains("folders")) database.createObjectStore("folders", { keyPath: "id" });
                    if (!database.objectStoreNames.contains("media")) {
                        const mediaStore = database.createObjectStore("media", { keyPath: "id" });
                        mediaStore.createIndex("folderId", "folderId", { unique: false });
                    }
                };
                request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                request.onerror = (e) => reject(e);
            });
        }

        function enterPin(digit) {
            if (enteredPin.length < 4) {
                enteredPin += digit;
                updatePinDots();
                if (enteredPin.length === 4) {
                    setTimeout(() => {
                        if (enteredPin === currentPin) {
                            document.getElementById("lockScreen").classList.add("hidden");
                            enteredPin = "";
                            updatePinDots();
                            loadFolders();
                            updateStorageUsage();
                        } else {
                            alert("Code PIN incorrect");
                            enteredPin = "";
                            updatePinDots();
                        }
                    }, 150);
                }
            }
        }

        function clearPin() { enteredPin = enteredPin.slice(0, -1); updatePinDots(); }
        function updatePinDots() {
            document.querySelectorAll("#pinDots div").forEach((dot, idx) => {
                dot.className = idx < enteredPin.length ? "w-3.5 h-3.5 rounded-full bg-iosPurple border-iosPurple" : "w-3.5 h-3.5 rounded-full border border-iosGray";
            });
        }

        function switchTab(tab) {
            document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
            document.querySelectorAll(".nav-item").forEach(el => el.className = "nav-item flex flex-col items-center space-y-1 text-iosGray");

            if (tab === 'folders') {
                document.getElementById("tabFolders").classList.remove("hidden");
                document.getElementById("nav-folders").className = "nav-item flex flex-col items-center space-y-1 text-iosPurple";
                document.getElementById("headerTitle").innerText = "Coffre";
                document.getElementById("fabContainer").classList.remove("hidden");
            } else if (tab === 'browser') {
                document.getElementById("tabBrowser").classList.remove("hidden");
                document.getElementById("nav-browser").className = "nav-item flex flex-col items-center space-y-1 text-iosPurple";
                document.getElementById("headerTitle").innerText = "Navigateur";
                document.getElementById("fabContainer").classList.add("hidden");
            } else if (tab === 'slideshow') {
                document.getElementById("tabSlideshow").classList.remove("hidden");
                document.getElementById("nav-slideshow").className = "nav-item flex flex-col items-center space-y-1 text-iosPurple";
                document.getElementById("headerTitle").innerText = "Diaporama";
                document.getElementById("fabContainer").classList.add("hidden");
                renderSlideshowFolderList();
            } else if (tab === 'settings') {
                document.getElementById("tabSettings").classList.remove("hidden");
                document.getElementById("nav-settings").className = "nav-item flex flex-col items-center space-y-1 text-iosPurple";
                document.getElementById("headerTitle").innerText = "Réglages";
                document.getElementById("fabContainer").classList.add("hidden");
                updateStorageUsage();
            }
        }

        function toggleFabMenu() {
            const menu = document.getElementById("fabMenu");
            menu.classList.toggle("hidden");
        }

        function handleFabUpload(event) {
            if (!currentFolderId) {
                alert("Ouvrez d'abord un dossier avant d'ajouter des fichiers.");
                return;
            }
            handleMediaUpload(event);
            toggleFabMenu();
        }

        function openCreateFolderModal() {
            const folderName = prompt("Nom du nouveau dossier :");
            if (folderName && folderName.trim() !== "") {
                const tx = db.transaction("folders", "readwrite");
                tx.objectStore("folders").add({ id: 'folder_' + Date.now(), name: folderName.trim(), createdAt: new Date() });
                tx.oncomplete = () => loadFolders();
            }
        }

        function loadFolders() {
            const grid = document.getElementById("foldersGrid");
            grid.innerHTML = "";
            const tx = db.transaction(["folders", "media"], "readonly");
            tx.objectStore("folders").getAll().onsuccess = (e) => {
                const folders = e.target.result;
                if (folders.length === 0) {
                    grid.innerHTML = `<div class="col-span-2 text-center py-12 text-iosGray text-sm">Aucun dossier. Appuyez sur + pour en créer un.</div>`;
                    return;
                }
                folders.forEach(folder => {
                    tx.objectStore("media").index("folderId").getAll(folder.id).onsuccess = (mEv) => {
                        const medias = mEv.target.result;
                        const card = document.createElement("div");
                        card.className = "bg-iosCard border border-iosCardBorder p-3 rounded-2xl flex flex-col justify-between h-44 active:scale-95 transition cursor-pointer overflow-hidden shadow-lg";
                        card.onclick = () => openFolder(folder.id, folder.name);

                        let previewHTML = medias.length > 0 ? `<div class="grid grid-cols-2 gap-1 w-full h-24 rounded-xl overflow-hidden bg-black/40 p-1 mb-2">` + 
                            medias.slice(0, 4).map(m => `<img src="${URL.createObjectURL(m.fileData)}" class="w-full h-full object-cover rounded">`).join('') + `</div>` :
                            `<div class="w-full h-24 bg-black/40 rounded-xl flex items-center justify-center mb-2"><i class="fa-solid fa-folder text-3xl text-iosPurple/70"></i></div>`;

                        card.innerHTML = `${previewHTML}<div class="mt-auto"><div class="font-bold text-xs truncate">${folder.name}</div><div class="text-[10px] text-iosGray">${medias.length} média(s)</div></div>`;
                        grid.appendChild(card);
                    };
                });
            };
        }

        function openFolder(folderId, folderName) {
            currentFolderId = folderId;
            document.getElementById("currentFolderName").innerText = folderName;
            document.getElementById("foldersGrid").classList.add("hidden");
            document.getElementById("folderDetailView").classList.remove("hidden");
            loadFolderMedia(folderId);
        }

        function closeFolderDetail() {
            currentFolderId = null;
            document.getElementById("folderDetailView").classList.add("hidden");
            document.getElementById("foldersGrid").classList.remove("hidden");
            loadFolders();
        }

        function handleMediaUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0 || !currentFolderId) return;

            const tx = db.transaction("media", "readwrite");
            const store = tx.objectStore("media");
            Array.from(files).forEach(file => {
                store.add({
                    id: 'media_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                    folderId: currentFolderId,
                    name: file.name,
                    type: file.type.startsWith('video') ? 'video' : 'image',
                    fileData: file,
                    createdAt: new Date()
                });
            });
            tx.oncomplete = () => loadFolderMedia(currentFolderId);
        }

        function loadFolderMedia(folderId) {
            const grid = document.getElementById("mediaGrid");
            grid.innerHTML = "";
            const tx = db.transaction("media", "readonly");
            tx.objectStore("media").index("folderId").getAll(folderId).onsuccess = (e) => {
                currentFolderMediaList = e.target.result;
                if (currentFolderMediaList.length === 0) {
                    grid.innerHTML = `<div class="col-span-2 text-center py-8 text-iosGray text-xs">Dossier vide.</div>`;
                    return;
                }
                currentFolderMediaList.forEach((item, index) => {
                    const url = URL.createObjectURL(item.fileData);
                    const el = document.createElement("div");
                    el.className = "relative aspect-square bg-black rounded-xl overflow-hidden border border-iosCardBorder group cursor-pointer active:scale-95 transition shadow-md";
                    el.onclick = () => openMediaViewer(index);

                    el.innerHTML = item.type === 'image' ? `<img src="${url}" class="w-full h-full object-cover">` :
                        `<video src="${url}" class="w-full h-full object-cover"></video><div class="absolute inset-0 bg-black/30 flex items-center justify-center"><i class="fa-solid fa-play text-white/80 text-xs"></i></div>`;
                    grid.appendChild(el);
                });
            };
        }

        // NAVIGATEUR WEB
        function loadWebPage() {
            let url = document.getElementById("browserUrlInput").value.trim();
            if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
            document.getElementById("browserFrame").src = url;
        }

        function openBookmark(url) {
            document.getElementById("browserUrlInput").value = url;
            document.getElementById("browserFrame").src = url;
        }

        function promptBookmark() {
            const url = prompt("Adresse du site Web :");
            if (url) openBookmark(url);
        }

        // VISIONNEUSE
        function openMediaViewer(index) {
            currentViewerIndex = index;
            document.getElementById("mediaViewerModal").classList.remove("hidden");
            renderViewerMedia();
        }

        function closeMediaViewer() {
            document.getElementById("mediaViewerModal").classList.add("hidden");
            document.getElementById("viewerContent").innerHTML = "";
        }

        function renderViewerMedia() {
            if (currentFolderMediaList.length === 0) { closeMediaViewer(); return; }
            const item = currentFolderMediaList[currentViewerIndex];
            const url = URL.createObjectURL(item.fileData);
            const container = document.getElementById("viewerContent");
            container.innerHTML = item.type === 'image' ? `<img src="${url}" class="max-w-full max-h-full object-contain rounded-lg">` :
                `<video src="${url}" controls autoplay playsinline class="max-w-full max-h-full object-contain rounded-lg"></video>`;
            document.getElementById("viewerCounter").innerText = `${currentViewerIndex + 1} / ${currentFolderMediaList.length}`;
        }

        function navigateViewer(direction) {
            currentViewerIndex = (currentViewerIndex + direction + currentFolderMediaList.length) % currentFolderMediaList.length;
            renderViewerMedia();
        }

        function deleteViewerMedia() {
            if (confirm("Supprimer ce média ?")) {
                const item = currentFolderMediaList[currentViewerIndex];
                const tx = db.transaction("media", "readwrite");
                tx.objectStore("media").delete(item.id);
                tx.oncomplete = () => {
                    loadFolderMedia(currentFolderId);
                    if (currentFolderMediaList.length <= 1) closeMediaViewer();
                    else { currentViewerIndex = currentViewerIndex % (currentFolderMediaList.length - 1); renderViewerMedia(); }
                };
            }
        }

        window.onload = () => { initDB(); };
    </script>
</body>
</html>
